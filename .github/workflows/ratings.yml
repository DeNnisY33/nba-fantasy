name: 2K ratings

# 只手動執行：選秀前更新能力值；選秀當天跑完後把 ratings_locked 設成 true 鎖定
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape 2kratings.com and apply
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/fetch_stats.py --job ratings
